services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerovanta_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/aerovanta.db
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerovanta_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

